<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cutie Assets Extraction Gallery</title>
  <style>
    :root {
      --bg-dark: #121214;
      --bg-card: #1e1e24;
      --accent: #ff4757;
      --accent-hover: #ff6b81;
      --text: #f1f2f6;
      --text-muted: #a4b0be;
      --border: #2f3542;
    }
    body {
      margin: 0;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
    }
    h1 {
      margin: 0 0 10px 0;
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ff4757, #ff6b81);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      margin: 0 0 30px 0;
      color: var(--text-muted);
      font-size: 1.1rem;
    }
    .char-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 40px;
      max-width: 800px;
      width: 100%;
    }
    .char-btn {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .char-btn img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      image-rendering: pixelated;
    }
    .char-btn:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .char-btn.active {
      background-color: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .main-display {
      max-width: 1100px;
      width: 100%;
      background-color: var(--bg-card);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }
    .char-title {
      font-size: 1.8rem;
      font-weight: 700;
      border-bottom: 2px solid var(--border);
      padding-bottom: 15px;
      margin: 0;
      color: var(--accent-hover);
    }
    .anims-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }
    .anim-card {
      background-color: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .anim-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .anim-name {
      font-size: 1.2rem;
      font-weight: 600;
      text-transform: capitalize;
    }
    .preview-box {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .live-preview {
      width: 80px;
      height: 80px;
      background-color: #2f3542;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .live-preview img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      image-rendering: pixelated;
    }
    .frame-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .frame-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      padding: 6px;
    }
    .frame-item img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      image-rendering: pixelated;
    }
    .frame-label {
      font-size: 0.7rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <h1>Cutie Assets Extraction Gallery</h1>
  <p class="subtitle">Extracting background-free, shadow-free, jitter-free animations for all 15 characters</p>

  <div class="char-grid" id="charGrid"></div>

  <div class="main-display" id="mainDisplay" style="display: none;">
    <h2 class="char-title" id="charTitle">Character 1</h2>
    <div class="anims-container" id="animsContainer"></div>
  </div>

  <script>
    const animMetadata = {"1": {"idle": 1, "attack": 8, "idle2": 6, "walking": 8}, "2": {"idle": 1, "attack": 5, "idle2": 2, "walking": 2}, "3": {"idle": 5, "attack": 8, "idle2": 6, "walking": 8}, "4": {"idle": 2, "attack": 8, "idle2": 7, "walking": 8}, "5": {"idle": 8, "attack": 8, "idle2": 8, "walking": 8}, "6": {"idle": 1, "attack": 3, "idle2": 3, "walking": 3}, "7": {"idle": 1, "attack": 6, "idle2": 2, "walking": 1}, "8": {"idle": 8, "attack": 8, "idle2": 8, "walking": 8}, "9": {"idle": 8, "attack": 8, "idle2": 8, "walking": 8}, "10": {"idle": 8, "attack": 8, "idle2": 8, "walking": 8}, "11": {"idle": 5, "attack": 8, "idle2": 8, "walking": 8}, "12": {"idle": 3, "attack": 8, "idle2": 8, "walking": 8}, "13": {"idle": 8, "attack": 8, "idle2": 8, "walking": 8}, "14": {"idle": 8, "attack": 8, "idle2": 8, "walking": 8}, "15": {"idle": 8, "attack": 8, "idle2": 8, "walking": 8}};
    const totalChars = 15;
    const anims = ['idle', 'attack', 'idle2', 'walking'];
    let selectedChar = 1;
    let animTimers = {};

    function init() {
      const grid = document.getElementById('charGrid');
      for (let i = 1; i <= totalChars; i++) {
        const btn = document.createElement('button');
        btn.className = `char-btn ${i === selectedChar ? 'active' : ''}`;
        btn.innerHTML = `
          <img src="assets/cutie_raw/char_${i}/idle_frame_0.png" alt="Char ${i}">
          <span>Char ${i}</span>
        `;
        btn.onclick = () => selectCharacter(i);
        grid.appendChild(btn);
      }
      selectCharacter(selectedChar);
    }

    function selectCharacter(id) {
      selectedChar = id;
      document.querySelectorAll('.char-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx + 1 === id);
      });

      // Clear previous timers
      Object.values(animTimers).forEach(clearInterval);
      animTimers = {};

      const display = document.getElementById('mainDisplay');
      display.style.display = 'block';

      const title = document.getElementById('charTitle');
      title.textContent = `Character ${id}`;

      const container = document.getElementById('animsContainer');
      container.innerHTML = '';

      anims.forEach(anim => {
        const frameCount = animMetadata[id][anim];
        if (frameCount === 0) return;

        const card = document.createElement('div');
        card.className = 'anim-card';

        // Set up live preview and frame strip
        let frameStripHtml = '';
        for (let f = 0; f < frameCount; f++) {
          frameStripHtml += `
            <div class="frame-item">
              <img src="assets/cutie_raw/char_${id}/${anim}_frame_${f}.png" alt="F${f}">
              <span class="frame-label">F${f}</span>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="anim-header">
            <span class="anim-name">${anim}</span>
          </div>
          <div class="preview-box">
            <div class="live-preview">
              <img id="live_${anim}" src="assets/cutie_raw/char_${id}/${anim}_frame_0.png" alt="Live">
            </div>
            <div class="frame-strip">
              ${frameStripHtml}
            </div>
          </div>
        `;
        container.appendChild(card);

        // Start JavaScript animation loop
        let currentFrame = 0;
        const liveImg = card.querySelector(`#live_${anim}`);
        animTimers[anim] = setInterval(() => {
          currentFrame = (currentFrame + 1) % frameCount;
          liveImg.src = `assets/cutie_raw/char_${id}/${anim}_frame_${currentFrame}.png`;
        }, 120); // 8 FPS loops
      });
    }

    window.onload = init;
  </script>
</body>
</html>
